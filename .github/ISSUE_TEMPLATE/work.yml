name: Work
description: Define one complete unit of work.
body:
  - type: dropdown
    id: work_type
    attributes:
      label: Work type
      description: Implementation changes repository files; Read-only produces analysis or review evidence without a PR.
      options:
        - Implementation
        - Read-only
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome is needed, and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and, where needed, excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable conditions for closing this Work.
    validations:
      required: true
