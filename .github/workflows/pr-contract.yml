name: Work Unit contract
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test validator
        run: python3 validation/validate_pr.py --test
      - name: Validate current pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          python3 validation/validate_pr.py < "$RUNNER_TEMP/pr-body.md"
