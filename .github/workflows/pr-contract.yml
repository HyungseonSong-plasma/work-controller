name: Work Unit contract
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 validation/validate_pr.py --test
      - run: python3 validation/validate_issue.py --test
      - run: python3 validation/validate_merge.py --test
  pr-template:
    name: pr-template
    needs: candidate-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require candidate tests
        env:
          TEST_RESULT: ${{ needs.candidate-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate current pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          WORK_NUMBER=$(python3 validation/validate_pr.py --work-number < "$RUNNER_TEMP/pr-body.md")
          gh api "repos/$GITHUB_REPOSITORY/issues/$WORK_NUMBER" > "$RUNNER_TEMP/work.json"
          python3 validation/validate_pr.py --issue-json "$WORK_NUMBER" < "$RUNNER_TEMP/work.json"
