name: B rank approval
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: grade-b-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  publish-grade-b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Publish pending status to PR head
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" -f state=pending -f context=grade-b -f description="Checking B-grade approval" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate B-grade approval using trusted base
        id: grade
        run: python3 -m app.cli approval --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --expected-head "$PR_HEAD" --expected-base "$PR_BASE"
      - name: Publish final status to PR head
        if: always()
        env:
          GRADE_OUTCOME: ${{ steps.grade.outcome }}
        run: |
          if [[ "$GRADE_OUTCOME" == success ]]; then
            state=success
            description="B approval satisfied or not applicable"
          else
            state=failure
            description="B approval missing or validation failure"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" -f state="$state" -f context=grade-b -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

