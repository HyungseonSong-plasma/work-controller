name: Work issue contract
on:
  issues:
    types: [opened, edited, reopened, closed]
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m app.cli test issue
  validate:
    if: github.event_name == 'issues' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: work-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate current issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/work-issue.json"
          jq -r '.body // ""' "$RUNNER_TEMP/work-issue.json" > "$RUNNER_TEMP/work-body.md"
          if python3 -m app.cli issue < "$RUNNER_TEMP/work-body.md"; then
            echo "Work contract passed."
          else
            if [[ "$(jq -r .state "$RUNNER_TEMP/work-issue.json")" == "open" ]]; then
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Work contract failed. Supply non-empty Objective, Scope, and Acceptance criteria sections using the Work template, then reopen the issue."
            fi
            echo "::error::Work contract failed."
            exit 1
          fi
  completion:
    if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: work-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guard completed Work closure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 -m app.cli completion --repo "$GITHUB_REPOSITORY" --work "$ISSUE_NUMBER" --guard-closed
