name: Review preflight
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/review ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run trusted CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          python3 -m app.cli review --repo "$GITHUB_REPOSITORY" --comment-request | tee "$RUNNER_TEMP/review.json"
      - name: Publish review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
