name: Review execute
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: Explicit owner-authorized operation
        type: choice
        options: [merge, close]
        required: true
      work:
        description: Work issue number
        type: string
        required: true
      pr:
        description: PR number (merge only)
        type: string
        default: ''
      snapshot:
        description: Reviewed snapshot SHA-256
        type: string
        required: true
      head:
        description: Expected PR head SHA (merge only)
        type: string
        default: ''
      evidence:
        description: Acceptance evidence (close only)
        type: string
        default: ''
permissions: {}
concurrency:
  group: review-execute
  cancel-in-progress: false
jobs:
  merge:
    env:
      REVIEW_ACTION: merge
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'merge') ||
       (github.event_name == 'issue_comment' && vars.AGENT_REVIEW_DELEGATION == 'v1' &&
        !github.event.issue.pull_request && github.event.issue.state == 'open' &&
        startsWith(github.event.comment.body, '/execute-review merge ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run trusted CLI
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_REVIEW_DELEGATION: ${{ vars.AGENT_REVIEW_DELEGATION }}
        run: python3 -m app.cli review --repo "$GITHUB_REPOSITORY" --execute-request
  close:
    env:
      REVIEW_ACTION: close
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'close') ||
       (github.event_name == 'issue_comment' && vars.AGENT_REVIEW_DELEGATION == 'v1' &&
        !github.event.issue.pull_request && github.event.issue.state == 'open' &&
        startsWith(github.event.comment.body, '/execute-review close ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run trusted CLI
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_REVIEW_DELEGATION: ${{ vars.AGENT_REVIEW_DELEGATION }}
        run: python3 -m app.cli review --repo "$GITHUB_REPOSITORY" --execute-request
