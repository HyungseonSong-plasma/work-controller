name: Executor live CI
# Run only after the reviewed Executor and this workflow are merged to main.
# Repository settings must allow GITHUB_TOKEN to create pull requests.
# This verifies publication, not the downstream PR CI triggered by the token.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: executor-live-ci
  cancel-in-progress: false

jobs:
  integration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute disposable C-grade Work Unit
        run: python3 -m app.cli executor-live-ci
